<!DOCTYPE html>
<html lang="en" data-theme="light" data-sidebar="expanded">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecureLoRA — Adapter Security Workbench</title>
  <meta name="description" content="SecureLoRA Adapter Security Workbench: privacy-preserving LoRA training, adapter screening, signed device-bound packaging and deployment verification.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a1830">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230f766e' d='M12 2l8 3v7c0 5-3.5 8-8 10-4.5-2-8-5-8-10V5z'/%3E%3C/svg%3E">
  <!--
    Blocking, dependency-free initialisation. It runs before the stylesheet is
    applied so the correct theme and sidebar state are present on first paint
    (no flash of the wrong theme on reload). Storage keys must match
    static/workbench/js/core/store.js. Stored choice wins; otherwise the OS
    preference is used.
  -->
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var t = localStorage.getItem("securelora-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        d.setAttribute("data-theme", t);
        d.style.colorScheme = t;
        var s = localStorage.getItem("securelora-sidebar");
        if (s !== "collapsed" && s !== "expanded") {
          s = window.matchMedia && window.matchMedia("(max-width: 1024px)").matches ? "collapsed" : "expanded";
        }
        d.setAttribute("data-sidebar", s);
      } catch (e) {
        d.setAttribute("data-theme", "light");
        d.setAttribute("data-sidebar", "expanded");
      }
      d.classList.add("no-transition");
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='workbench/workbench.css', v=asset_version) }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="SecureLoRA Workbench — Overview">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">SecureLoRA</span>
          <span class="brand-sub">Security Workbench</span>
        </span>
      </a>
      <nav class="nav" id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <button type="button" class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" data-tip="Collapse sidebar (Ctrl+B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
          <span class="nav-label" id="sidebar-toggle-label">Collapse</span>
        </button>
        <p class="sidebar-note">Research prototype. Software-derived device binding is not hardware-backed.</p>
      </div>
    </aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="topbar-title">Adapter Security Workbench</span>
        <span class="topbar-spacer"></span>
        <div class="topbar-actions">
          <a class="conn-pill" id="conn-pill" href="#/settings" data-state="checking" data-tip="API connection status">
            <span class="dot" aria-hidden="true"></span><span class="conn-text" id="conn-text">Checking…</span>
          </a>
          <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Dark theme" data-tip="Toggle light / dark theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="main" tabindex="-1">
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
        <div id="view">
          <noscript><p>The SecureLoRA Workbench requires JavaScript.</p></noscript>
        </div>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>

  <script type="module" src="{{ url_for('static', filename='workbench/js/app.js', v=asset_version) }}"></script>
</body>
</html>
