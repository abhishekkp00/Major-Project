[pytest]
minversion = 7.0
testpaths = tests
addopts = -ra --strict-markers --showlocals
markers =
    security: Security regression tests (key isolation, anti-replay, traversal, signatures, auth)
    unit: Fast unit tests for individual components
    integration: Multi-phase pipeline workflow integration tests
    evaluation: Research provenance, evaluation API, and metric integrity tests
    concurrency: Cross-process database transactions and concurrency tests
    slow: Computationally intensive fine-tuning or differential privacy runs
filterwarnings =
    ignore::DeprecationWarning:swig.*
    ignore::DeprecationWarning:transformers.models.bert.*
    ignore::DeprecationWarning:opacus.*
    ignore::UserWarning:torch.*
    ignore::UserWarning:peft.*
    ignore::UserWarning:opacus.*
