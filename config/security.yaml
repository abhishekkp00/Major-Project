secure_lora_key_path: "secrets.key"
rsa_key_bits: 2048
rsa_private_key_path: "outputs/protected_adapter/dev_private.pem"
rsa_public_key_path: "outputs/protected_adapter/public.pem"
adapter_id: "lora-adapter-v1"
model_reference: "JackFram/llama-68m"
package_version: "3.0.0"

# ── Adaptive Device Binding Policy Configuration ──────────────────────────────
# Controls strictness and allowable feature changes for adapter deployment.
#
# Device States:
#   1. AUTHORIZED — all policy rules pass, fingerprint matches baseline.
#   2. REAUTHORIZATION_REQUIRED — allowable semi-stable/volatile features changed,
#      requiring explicit admin re-authorization token.
#   3. UNAUTHORIZED — stable features changed or policy-disallowed changes detected.
binding_policy:
  enabled: true
  strictness: "high"   # Options: high, medium, low

  stable_features:
    machine_id: "required"
    cpu_model: "required"

  semi_stable_features:
    disk_uuid: "required"

  volatile_features:
    hostname: "informational"
    network_interfaces: "informational"

  policy:
    allow_network_change: true
    allow_hostname_change: true
    allow_disk_change: false
    allow_machine_id_change: false
    allow_cpu_change: false


